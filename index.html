<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频片段播放测试</title><style>body{font:17px system-ui;max-width:800px;margin:40px auto;padding:20px;background:#f4f6fa;color:#17243b}video{width:100%;max-height:60vh;background:#111;border-radius:16px}button{font:inherit;padding:12px 18px;margin:14px 8px 14px 0;border:0;border-radius:10px;background:#2458da;color:white}pre{white-space:pre-wrap;background:white;padding:20px;border-radius:12px}</style><h1>同一案例 · 片段播放验证</h1><p>S2-04 可灵 · 播放 5.6–7.5 秒。播放到终点自动暂停，可原地重播。</p><video id="v" controls playsinline preload="metadata" src="sample.mp4"></video><button id="play">播放指定片段</button><button id="replay">重播这一段</button><pre id="status"></pre><pre id="events"></pre><script>
const v=document.getElementById('v'),s=document.getElementById('status'),log=document.getElementById('events');let run=false,events=[];function add(x){events.push(x);log.textContent=events.slice(-10).join('\n')}function tick(){if(run&&v.currentTime>=7.5){v.pause();v.currentTime=7.5;run=false;add('自动停止：7.500秒')}s.textContent=JSON.stringify({时间:v.currentTime,时长:v.duration,暂停:v.paused,就绪状态:v.readyState,错误:v.error?.message},null,2);requestAnimationFrame(tick)}async function start(){try{run=true;v.currentTime=5.6;add('定位并播放：5.600秒');await v.play()}catch(e){run=false;add(e.message)}}document.getElementById('play').onclick=start;document.getElementById('replay').onclick=start;v.onseeked=()=>add('定位完成：'+v.currentTime.toFixed(3)+'秒');v.onloadedmetadata=()=>add('视频已加载');tick();
</script></html>
